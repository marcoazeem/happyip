[package]
name = "happyip"
version = "0.2.2"
edition = "2024"
description = "Fast LAN scanner for Windows and macOS: IPs, MACs, vendors, logged-in users, device types and HTML reports"
license = "MIT"
repository = "https://github.com/marcoazeem/happyip"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dns-lookup = "4.0.2"
eframe = "0.34"
egui_extras = "0.34"
egui_software_backend = "0.0.3"
if-addrs = "0.15.0"
mac_address = "1.2.1"
rfd = "0.17.2"
webbrowser = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
